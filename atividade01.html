<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 01</title>
</head>
<body>
    <h2>Atividade 01</h2>

    <label>Nome Completo:</label>
    <input type="text" id="nomeCompleto">

    <button onclick="separar()"> &gt;&gt; </button>

    <br><br>

    <label>Nome:</label>
    <input type="text" id="nome">

    <label>Sobrenome:</label>
    <input type="text" id="sobrenome">

    <script>
        function separar() {
            let nomeC = document.getElementById("nomeCompleto").value.trim();
            let partes = nomeC.split(" ");

            document.getElementById("nome").value = partes[0];
            document.getElementById("sobrenome").value = partes.slice(1).join(" ");
        }
    </script>
</body>
</html>
