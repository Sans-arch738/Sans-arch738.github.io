<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/jpg" href="favicon.ico"/>
    <title>Robotron 2000</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;500&display=swap" rel="stylesheet"> 
</head>
<body>
    <main>

     
        <section class="robotron" style="text-align:center;">
            <img id="robotron" class="robo" src="robotron.png" alt="Robotron" width="300">
            <figcaption class="titulo">ROBOTRON <br>2000</figcaption>

            <div style="margin-top: 15px;">
                <button id="btnAnterior" type="button">&lt;&lt;</button>
                <button id="btnProximo" type="button">&gt;&gt;</button>
            </div>
        </section>

       
        <section class="box estatisticas">
            <div class="estatistica">
                <p class="estatistica-titulo">Força</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">768</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Poder</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">630</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Energia</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">289</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Velocidade</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">597</p>
                </div>
            </div>
        </section>

       
        <section class="equipamentos">
            <form action="" class="montador">
                <div class="box montador-conteudo">

                    <div class="peca">
                        <label class="peca-titulo">Braços</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Blindagem</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Núcleos</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Pernas</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Foguetes</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                </div>

                <input type="submit" value="Iniciar produção" class="producao" id="producao">
            </form>
        </section>

    </main>
    
    
    <script>
    
        const listaRobos = [
            "robotron-rosa.png",
            "robotron-cinza.png",
            "robotron-preto.png",
            "robotron-amarelo.png",
            "robotron-azul.png"
        ];

       
        const roboImg = document.getElementById("robotron");
        const btnProximo = document.getElementById("btnProximo");
        const btnAnterior = document.getElementById("btnAnterior");

        let roboAtual = 0;

        
        function trocarRobo(direcao) {
            if (direcao === "proximo") {
                roboAtual++;
                if (roboAtual >= listaRobos.length) roboAtual = 0;
            } 
            else if (direcao === "anterior") {
                roboAtual--;
                if (roboAtual < 0) roboAtual = listaRobos.length - 1;
            }

            roboImg.src = listaRobos[roboAtual];
        }

        btnProximo.addEventListener("click", () => trocarRobo("proximo"));
        btnAnterior.addEventListener("click", () => trocarRobo("anterior"));
    </script>

</body>
</html>
